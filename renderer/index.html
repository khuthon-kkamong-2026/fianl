<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://i.scdn.co https://*.scdn.co https://*.dzcdn.net data:; media-src 'self' https://p.scdn.co https://*.scdn.co https://*.dzcdn.net; connect-src 'self' https://api.deezer.com;" />
  <title>찾으라우저</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">

    <!-- 상단 네비게이션 바 -->
    <header class="topbar">
      <div class="topbar-logo">
        <span id="logo-text">👁 찾으라우저</span>
      </div>

      <div class="topbar-url-area">
        <input
          id="url-input"
          class="url-input"
          type="text"
          placeholder="https://www.melon.com  |  https://music.bugs.co.kr  |  https://..."
          spellcheck="false"
        />
        <button id="btn-go" class="btn-go">이동</button>
      </div>

      <div class="topbar-actions">
        <button id="btn-font-up"   class="btn-icon" title="글씨 크게">가↑</button>
        <button id="btn-font-down" class="btn-icon" title="글씨 작게">가↓</button>
      </div>
    </header>

    <!-- 원본 브라우저 네비게이션 바 (사이트 열릴 때만 표시) -->
    <div id="browser-navbar" class="browser-navbar hidden">
      <button id="bv-back"    class="bv-btn" title="뒤로">←</button>
      <button id="bv-forward" class="bv-btn" title="앞으로">→</button>
      <button id="bv-reload"  class="bv-btn" title="새로고침">↻</button>
      <div class="bv-url-display" id="bv-url-display">주소를 입력하세요</div>
      <div class="bv-loading" id="bv-loading"></div>
      <button id="bv-slow-mode" class="bv-slow-btn" title="알고리즘 무력화 — 랜덤 탐색">👁 찾아보자</button>
      <button id="bv-home" class="bv-btn" title="홈으로">🏠</button>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <main id="content-area">

      <!-- 홈 화면 -->
      <section id="home-screen" class="home-screen">

        <div class="home-hero">
          <h1 class="home-title">알고리즘을 끄고,<br>진짜를 발견하세요 👁</h1>
          <p class="home-desc">
            플랫폼 알고리즘은 인기 있는 것만 보여줘요.<br>
            찾으라우저는 순서를 무력화하고, 숨겨진 콘텐츠를 꺼냅니다.
          </p>
        </div>

        <!-- 플랫폼 바로가기 -->
        <div class="platform-section">
          <div class="platform-label">🎵 음악 플랫폼</div>
          <div class="platform-btns">
            <button class="platform-btn" data-url="https://www.melon.com/chart/index.htm">
              <span class="platform-icon">🍈</span>
              <span class="platform-name">Melon 차트</span>
            </button>
            <button class="platform-btn" data-url="https://music.bugs.co.kr/chart">
              <span class="platform-icon">🐛</span>
              <span class="platform-name">Bugs 차트</span>
            </button>
            <button class="platform-btn" data-url="https://www.genie.co.kr/chart/top200">
              <span class="platform-icon">🧞</span>
              <span class="platform-name">Genie 차트</span>
            </button>
            <button class="platform-btn" data-url="https://open.spotify.com">
              <span class="platform-icon">🎧</span>
              <span class="platform-name">Spotify</span>
            </button>
          </div>
        </div>

        <div class="platform-section">
          <div class="platform-label">📺 영상 플랫폼</div>
          <div class="platform-btns">
            <button class="platform-btn" data-url="https://www.youtube.com">
              <span class="platform-icon">▶️</span>
              <span class="platform-name">YouTube</span>
            </button>
            <button class="platform-btn" data-url="http://localhost:3001">
              <span class="platform-icon">🎬</span>
              <span class="platform-name">StreamHub<br><small>데모</small></span>
            </button>
          </div>
        </div>

        <!-- Spotify 자격증명 입력 폼 (숨김, JS로 제어) -->
        <div id="spotify-cred-form" class="spotify-cred-form hidden">
          <p class="spotify-cred-desc">
            Spotify Developer 앱의 Client ID와 Secret을 입력하세요.<br>
            <a id="spotify-dev-link" href="#" style="color:#1DB954;font-size:0.85em">
              👉 developer.spotify.com/dashboard 에서 발급
            </a>
          </p>
          <input id="sp-client-id"     class="sp-input" type="text"     placeholder="Client ID" />
          <input id="sp-client-secret" class="sp-input" type="password" placeholder="Client Secret" />
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button id="sp-confirm" class="sp-btn sp-btn--primary">탐색 시작</button>
            <button id="sp-cancel"  class="sp-btn">취소</button>
          </div>
        </div>

      </section>

      <!-- 발견 탐색 결과 화면 (동적으로 렌더링) -->
      <section id="guide-screen" class="guide-screen hidden">
        <div id="guide-content"></div>
      </section>

    </main>

  </div>

  <script src="pages/app.js"></script>
</body>
</html>
